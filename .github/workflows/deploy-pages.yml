name: Deploy Forge Muscu to GitHub Pages

on:
  push:
    branches: [main, forge-premium-upgrade]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p public
          if [ -f forge-muscu.zip ]; then
            unzip -q forge-muscu.zip -d extracted
            cp -a extracted/forge-muscu/. public/
          else
            echo "forge-muscu.zip is missing from the repository root" >&2
            exit 1
          fi
          # Overlay des modules actualisés sans remplacer l'archive de référence.
          if [ -d forge-muscu ]; then
            cp -a forge-muscu/. public/
          fi
          touch public/.nojekyll
          test -f public/index.html
          test -f public/js/view-liftoff.js
          test -f public/css/liftoff.css

      - name: Bundle all CC0 3D exercise illustrations
        run: |
          SOURCE_COMMIT=2786aefa4b36a08faeca8114e0d1eb0af3ef6732
          curl --fail --location --retry 3 "https://github.com/hitmanrepo/open-exercise-illustrations/archive/${SOURCE_COMMIT}.zip" -o /tmp/exercise-illustrations.zip
          mkdir -p /tmp/exercise-illustrations
          unzip -q /tmp/exercise-illustrations.zip -d /tmp/exercise-illustrations
          SOURCE_DIR="/tmp/exercise-illustrations/open-exercise-illustrations-${SOURCE_COMMIT}"
          mkdir -p public/images/exercises public/credits
          cp -a "${SOURCE_DIR}/images/." public/images/exercises/
          cp "${SOURCE_DIR}/LICENSE" public/credits/exercise-illustrations-CC0.txt
          test -f public/images/exercises/bench-press/start.webp

      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Test Séance on mobile and desktop
        run: FORGE_SITE=public node forge-muscu/tests/seance-smoke.cjs

      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-muscu-seance-qa
          path: /tmp/forge-seance-*
          if-no-files-found: ignore
          retention-days: 3

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
