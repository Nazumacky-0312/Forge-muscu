name: Deploy Forge Muscu to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p public
          if [ -f forge-muscu.zip ]; then
            unzip -q forge-muscu.zip -d extracted
            cp -a extracted/forge-muscu/. public/
          else
            echo "forge-muscu.zip is missing from the repository root" >&2
            exit 1
          fi
          # Overlay des modules actualisés sans remplacer l'archive de référence.
          if [ -d forge-muscu ]; then
            cp -a forge-muscu/. public/
          fi
          touch public/.nojekyll
          test -f public/index.html
          test -f public/js/view-liftoff.js
          test -f public/css/liftoff.css

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
